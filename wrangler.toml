name = "ident-link"
main = "worker/build/index.js"
compatibility_date = "2026-10-20"
# Upstream DID documents choose PDS URLs; never bypass Cloudflare's public
# routing when fetching an untrusted endpoint in this zone.
compatibility_flags = ["global_fetch_strictly_public"]

[build]
command = "sh scripts/build-worker.sh"
watch_dir = "worker/src"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/agent-of/*"]

[previews]
